  const architectureDisplayNote=getArchitectureDisplayNote(ARCHITECTURE_UI.display);
  const architectureSignals=getArchitectureSignals(architectureFacts).map(signal=>`<div class="architecture-insight ${signal.tone}"><div class="architecture-insight-label">${escapeHtml(signal.label)}</div><div class="architecture-insight-value">${escapeHtml(signal.value)}</div><div class="architecture-insight-note">${escapeHtml(signal.note)}</div></div>`).join('');
  const architectureViewCards=Object.entries(architectureViews).map(([key,view])=>{const summary=summarizeArchitectureDiagram(view.code);return `<button type="button" class="architecture-view-card ${ARCHITECTURE_UI.panel===key?'active':''}" onclick="setArchitecturePanel('${key}')"><div class="architecture-view-card-head"><div class="architecture-view-title">${escapeHtml(view.title)}</div><span class="architecture-view-status">${ARCHITECTURE_UI.panel===key?'Active':'View'}</span></div><div class="architecture-view-copy">${escapeHtml(view.subtitle)}</div><div class="architecture-view-meta"><span>${summary.serviceCount} services</span><span>${summary.edgeCount} flows</span></div></button>`;}).join('');
  const architectureLegend=architectureView.notes.map(note=>`<div class="architecture-legend-row"><span class="architecture-legend-dot"></span><span>${escapeHtml(note)}</span></div>`).join('');
  const architectureShowDiagram=ARCHITECTURE_UI.display!=='code';
  const architectureShowCode=ARCHITECTURE_UI.display!=='diagram';
  const architectureStageClass=`architecture-stage${ARCHITECTURE_UI.display==='split'?' split':''}`;
  const architectureSection=`<div class="card architecture-card"><div class="architecture-hero"><div><div class="architecture-kicker">Diagram Studio — ${escapeHtml(activeTier.label)}</div><div class="architecture-title">${escapeHtml(architectureView.title)}</div><div class="architecture-subtitle">${escapeHtml(architectureView.source)}</div></div><div class="architecture-toolbar"><span class="arch-pill">${escapeHtml(architectureDisplayLabel)}</span><button class="btn" onclick="copyArchitectureCode()">Copy Python</button></div></div><div class="architecture-view-grid">${architectureViewCards}</div><div class="architecture-metrics"><div class="architecture-metric"><div class="architecture-metric-label">Groups</div><div class="architecture-metric-value">${architectureSummary.groupCount}</div></div><div class="architecture-metric"><div class="architecture-metric-label">Services</div><div class="architecture-metric-value">${architectureSummary.serviceCount}</div></div><div class="architecture-metric"><div class="architecture-metric-label">Flows</div><div class="architecture-metric-value">${architectureSummary.edgeCount}</div></div><div class="architecture-metric"><div class="architecture-metric-label">Tier</div><div class="architecture-metric-value" style="font-size:13px">${escapeHtml(activeTier.label)}</div></div></div><div class="architecture-insight-grid">${architectureSignals}</div><div class="architecture-layout"><div class="architecture-main"><div class="architecture-main-tools"><div class="architecture-segments"><button class="architecture-segment ${ARCHITECTURE_UI.display==='diagram'?'active':''}" onclick="setArchitectureDisplay('diagram')">Diagram</button><button class="architecture-segment ${ARCHITECTURE_UI.display==='split'?'active':''}" onclick="setArchitectureDisplay('split')">Split</button><button class="architecture-segment ${ARCHITECTURE_UI.display==='code'?'active':''}" onclick="setArchitectureDisplay('code')">Code</button></div><div class="architecture-stage-note">${escapeHtml(architectureDisplayNote)}</div></div><div class="${architectureStageClass}"><div class="diagram-wrap" style="display:${architectureShowDiagram?'block':'none'}"><div class="architecture-stage-top"><div><div class="architecture-stage-label">Rendered canvas</div><div class="architecture-stage-caption">Server-rendered SVG output generated by the Python diagrams renderer.</div></div><div class="architecture-stage-badge">Live render</div></div><div class="mermaid" id="architecture-mermaid"></div></div><div class="architecture-code-panel" style="display:${architectureShowCode?'block':'none'}"><div class="architecture-stage-top"><div><div class="architecture-stage-label">Python source</div><div class="architecture-stage-caption">Underlying Python diagrams source for export and renderer iteration.</div></div><div class="architecture-stage-badge">Source</div></div><div class="architecture-code-actions"><button class="btn" onclick="copyArchitectureCode()">Copy Python</button></div><pre class="diagram-code" id="architecture-code"></pre></div></div></div><aside class="architecture-side"><div class="architecture-side-section"><div class="architecture-side-heading">View brief</div><div class="architecture-side-title">${escapeHtml(architectureView.subtitle)}</div><div class="architecture-side-copy">${escapeHtml(architectureView.summary)}</div></div><div class="architecture-side-section"><div class="architecture-side-heading">Topology signals</div><div class="architecture-group-list">${architectureGroups}</div></div><div class="architecture-side-section"><div class="architecture-side-heading">Reading guide</div><div class="architecture-legend">${architectureLegend}</div></div></aside></div></div>`;
  // Store the view+facts on window so renderArchitectureDiagram can be called after innerHTML
  window.__activeTierViews={architectureView,architectureFacts};
  return {stackRows,breakdown,architectureSection};
}

function showOutput(result,contradictions=[],research=null,validation=null){
  window.__lastResult=result;
  LAST_CONTRADICTIONS=Array.isArray(contradictions)?contradictions:[];
  LAST_RESEARCH=research;
  LAST_VALIDATION=validation;

  const tiers=result.tiers||[];
  const activeTier=tiers.find(t=>t.id===ACTIVE_TIER)||tiers.find(t=>t.id==='recommended')||tiers[0];
  if(!activeTier){document.getElementById('out').innerHTML='<div class="err-box">No tier data in response.</div>';return;}

  // Tier selector
  const priceBadge=LAST_PRICING_CONTEXT?.summary?.length?`<span class="price-live">Live pricing applied</span>`:'';
  const tierCards=tiers.map(t=>{
    const isActive=t.id===activeTier.id;
    const budgetCls=t.budget_feasible?'tier-budget-ok':'tier-budget-over';
    return `<div class="tier-card${isActive?' active':''}" onclick="setTier('${t.id}')">${isActive?'<span class="tier-active-badge">Selected</span>':''}<div class="tier-card-label">${escapeHtml(t.label)}</div><div class="tier-card-tagline">${escapeHtml(t.tagline||'-')}</div><div class="tier-card-price">${escapeHtml(t.monthly_total||'-')}</div><span class="tier-budget ${budgetCls}">${t.budget_feasible?'✓':'✗'} ${escapeHtml(t.budget_note||'-')}</span></div>`;
  }).join('');

  // Active tier content (stack + architecture + cost breakdown)
  const {stackRows,breakdown,architectureSection}=buildTierSection(activeTier);

  // Shared sections
  const risks=(result.risks||[]).map(item=>`<div class="risk-row"><span class="sev ${item.severity==='High'?'sev-h':item.severity==='Medium'?'sev-m':'sev-l'}">${escapeHtml(item.severity||'-')}</span><div><div class="risk-text">${escapeHtml(item.risk||'-')}</div><div class="risk-fix tech-only">Likelihood: ${escapeHtml(item.likelihood||'-')} | Mitigation: ${escapeHtml(item.fix||'-')}</div></div></div>`).join('');
  const decisions=(result.decisions||[]).map(item=>`<div class="risk-row"><span class="sev sev-l">Decision</span><div><div class="risk-text">${escapeHtml(item.what||'-')}</div><div class="risk-fix">${escapeHtml(item.why||'-')}</div></div></div>`).join('');
  const nextSteps=(result.next_steps||[]).map((item,index)=>`<div class="step-item"><div class="step-n">${index+1}</div><div class="step-text">${escapeHtml(item)}</div></div>`).join('');
  const roadmap=(result.roadmap||[]).map((item,index)=>{const bullets=(item.deliverables||[]).map(d=>`<li>${escapeHtml(d)}</li>`).join('');return `<div class="rm-phase"><div class="rm-rail"><div class="rm-node">${index+1}</div><div class="rm-line"></div></div><div class="rm-body"><div class="rm-head"><div class="rm-title">${escapeHtml(item.phase||'-')}</div><span class="rm-badge">${escapeHtml(item.timeline||'-')}</span></div><ul class="rm-deliverables tech-only">${bullets}</ul><div class="rm-footer tech-only"><div class="rm-meta-row"><span class="rm-meta-label rm-owner-label">Owner</span><span class="rm-meta-val">${escapeHtml(item.owner||'-')}</span></div><div class="rm-meta-row"><span class="rm-meta-label rm-done-label">Done when</span><span class="rm-meta-val">${escapeHtml(item.done_when||'-')}</span></div></div></div></div>`;}).join('');

  // Research card
  let researchCard='';
  if(research){
    const conf=research.research_confidence||'low';
    const confCls=conf==='high'?'rc-high':conf==='medium'?'rc-medium':'rc-low';
    const fields=[['Company profile',research.company_profile],['Stack observations',research.stack_observations],['Industry compliance',research.industry_compliance],['Competitor patterns',research.competitor_patterns]].filter(([,v])=>v).map(([l,v])=>`<div class="research-field"><div class="rf-label">${l}</div><div class="rf-value">${escapeHtml(v)}</div></div>`).join('');
    const flags=(research.red_flags||[]).map(f=>`<div class="flag-item">⚑ ${escapeHtml(f)}</div>`).join('');
    researchCard=`<div class="research-card"><div class="research-header"><div class="research-dot"></div><span class="research-title">Pre-engagement research</span><span class="research-confidence ${confCls}">${conf} confidence</span></div><div class="research-grid">${fields}</div>${flags?`<div class="research-flags">${flags}</div>`:''}</div>`;
  }

  // Validation card
  let validationCard='';
  if(validation){
    const v=validation.verdict||'warn';
    const vcCls=v==='pass'?'vc-pass':v==='fail'?'vc-fail':'vc-warn';
    const vvCls=v==='pass'?'vv-pass':v==='fail'?'vv-fail':'vv-warn';
    const violations=(validation.constraint_violations||[]).map(i=>`<div class="validation-item"><div class="vi-dot vi-violation"></div>${escapeHtml(i)}</div>`).join('');
    const warnings=(validation.warnings||[]).map(i=>`<div class="validation-item"><div class="vi-dot vi-warning"></div>${escapeHtml(i)}</div>`).join('');
    const improvements=(validation.improvements||[]).map(i=>`<div class="validation-item"><div class="vi-dot vi-improvement"></div>${escapeHtml(i)}</div>`).join('');
    validationCard=`<div class="validation-card ${vcCls}"><div class="validation-header"><span class="validation-verdict ${vvCls}">${v}</span><span class="validation-title">Output validation</span></div>${validation.budget_note?`<div class="validation-item" style="margin-bottom:.5rem">${escapeHtml(validation.budget_note)}</div>`:''}<div style="font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em;margin:.5rem 0 .25rem">Violations</div>${violations||'<div class="validation-item">None found</div>'}<div style="font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em;margin:.5rem 0 .25rem">Warnings</div>${warnings||'<div class="validation-item">None</div>'}<div style="font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.05em;margin:.5rem 0 .25rem">Suggested improvements</div>${improvements||'<div class="validation-item">None</div>'}<div style="font-size:11px;color:var(--color-text-secondary);margin-top:.75rem">Price accuracy: ${escapeHtml(validation.price_accuracy||'—')}</div></div>`;
  }

  // Contradiction card
  let contraCard='';
  if(contradictions?.length){
    const items=contradictions.map(i=>`<div class="contradiction-item"><div class="ci-dot ci-${i.severity}">${i.severity==='high'?'!':i.severity==='medium'?'▲':'i'}</div><span>${escapeHtml(i.msg)}</span></div>`).join('');
    contraCard=`<div class="contradiction-box"><div class="contradiction-title">Input issues flagged during generation</div>${items}</div>`;
  }

  const viewBar=`<div class="out-view-bar"><button class="ovp${AUDIENCE_VIEW==='technical'?' active':''}" data-mode="technical" onclick="setAudience('technical')">Technical view</button><button class="ovp${AUDIENCE_VIEW==='executive'?' active':''}" data-mode="executive" onclick="setAudience('executive')">Executive view</button></div>`;
  const execBanner=`<div class="exec-banner exec-only"><div class="exec-banner-label">Executive summary view</div><div class="exec-banner-body">Showing a simplified, business-focused summary. Switch to <strong>Technical view</strong> to see full stack details, architecture diagrams, and implementation specifics.</div></div>`;

  document.getElementById('out').innerHTML=`${viewBar}${execBanner}${researchCard?`<div class="tech-only">${researchCard}</div>`:''}${contraCard}${validationCard?`<div class="tech-only">${validationCard}</div>`:''}<div class="out-summary">${escapeHtml(result.executive_summary||'-')}</div><div class="tier-selector">${tierCards}</div><div class="card"><div class="card-head"><div class="card-head-dot"></div>Architecture recommendation — ${escapeHtml(activeTier.label)} ${priceBadge}</div><table class="stack-table"><thead><tr><th style="width:130px">Layer</th><th class="tech-only" style="width:150px">Technology</th><th>Rationale</th><th class="tech-only" style="width:120px">Monthly est.</th></tr></thead><tbody>${stackRows}</tbody></table></div><div class="tech-only">${architectureSection}</div><div class="card tech-only"><div class="card-head"><div class="card-head-dot"></div>Cost breakdown — ${escapeHtml(activeTier.label)}</div><div class="cost-breakdown"><div class="cost-c"><div class="cost-tier-label">LLM API</div><div class="cost-val" style="font-size:15px">${escapeHtml(breakdown.llm_api||'-')}</div></div><div class="cost-c"><div class="cost-tier-label">Compute</div><div class="cost-val" style="font-size:15px">${escapeHtml(breakdown.compute||'-')}</div></div><div class="cost-c"><div class="cost-tier-label">Storage</div><div class="cost-val" style="font-size:15px">${escapeHtml(breakdown.storage||'-')}</div></div><div class="cost-c"><div class="cost-tier-label">Networking</div><div class="cost-val" style="font-size:15px">${escapeHtml(breakdown.networking||'-')}</div></div><div class="cost-c"><div class="cost-tier-label">Tooling</div><div class="cost-val" style="font-size:15px">${escapeHtml(breakdown.tooling||'-')}</div></div></div><div class="cost-driver" style="margin-top:1rem">Biggest cost driver: ${escapeHtml(activeTier.biggest_cost_driver||'-')}</div></div><div class="card"><div class="card-head"><div class="card-head-dot"></div>Risk register</div>${risks}</div><div class="card tech-only"><div class="card-head"><div class="card-head-dot"></div>Decision rationale</div>${decisions}</div><div class="card"><div class="card-head"><div class="card-head-dot"></div>Implementation roadmap</div><div class="roadmap-timeline">${roadmap}</div></div><div class="card"><div class="card-head"><div class="card-head-dot"></div>Immediate next steps</div>${nextSteps}</div><div class="card"><div class="card-head"><div class="card-head-dot"></div>Disclaimer</div><div class="risk-fix">${escapeHtml(result.disclaimer||'-')}</div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;gap:1rem;flex-wrap:wrap"><button class="btn" onclick="newEngagement()">New engagement</button><button class="btn pri" onclick="window.print()">Print / Save as PDF</button></div>`;

  setAudience(AUDIENCE_VIEW);
  if(window.__activeTierViews){
    renderArchitectureDiagram(window.__activeTierViews.architectureView,window.__activeTierViews.architectureFacts);
  }
}

function newEngagement(){
  ACTIVE_SCENARIO_ID=DEFAULT_SCENARIO_ID;
  ACTIVE_TIER='recommended';
  S=getDefaultState();
  DIAGRAM_RENDER_CACHE={};
  DIAGRAM_RENDER_TOKEN=0;
  LAST_CONTRADICTIONS=[];
  LAST_RESEARCH=null;
  LAST_PRICING_CONTEXT=null;
  LAST_VALIDATION=null;
  logEvent('warn','engagement.reset',{company:S.basics.company});
  render();
}

logEvent('info','app.loaded',{step:STEPS[S.step],company:S.basics.company});
render();
refreshServerConfig();
</script>
</body>
</html>
